name: Build Desktop (Windows .exe)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:../db/custom.db
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create SQLite database (schema)
        run: npx prisma db push --skip-generate

      - name: Build Next.js (standalone)
        run: npx next build

      - name: Package Windows installer (.exe)
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache

      - name: Upload artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: zPos-Windows-Setup-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
